name: Benefit Refresh Scheduler

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_live_feed:
        description: "Run live official feed refresh immediately, even when the current minute is not 00."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      minimum_visible_benefits:
        description: "Minimum visible official/free benefits required after refresh."
        required: false
        default: "100"
        type: string

concurrency:
  group: benefit-refresh-scheduler
  cancel-in-progress: true

jobs:
  refresh-benefits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: ${{ vars.HALINDOSA_SITE_URL || 'https://www.halindosa.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.HALINDOSA_CRON_SECRET }}
      FORCE_LIVE_FEED: ${{ github.event.inputs.force_live_feed || 'false' }}
      MINIMUM_VISIBLE_BENEFITS: ${{ github.event.inputs.minimum_visible_benefits || '100' }}
    steps:
      - name: Refresh free benefits
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::notice::CRON_SECRET or HALINDOSA_CRON_SECRET is not configured. Skipping protected refresh."
            exit 0
          fi

          base_url="${SITE_URL%/}"
          echo "Refreshing verified free benefits from ${base_url}"
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base_url}/api/cron/benefits"

      - name: Refresh live official feed on the hour
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::notice::CRON_SECRET or HALINDOSA_CRON_SECRET is not configured. Skipping protected live feed refresh."
            exit 0
          fi

          current_minute="$(date -u +%M)"
          if [[ "${FORCE_LIVE_FEED}" != "true" && "${current_minute}" != "00" ]]; then
            echo "Skipping live feed refresh at minute ${current_minute}; it runs on hourly scheduler ticks only."
            exit 0
          fi

          base_url="${SITE_URL%/}"
          echo "Refreshing live official feed from ${base_url}"
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base_url}/api/cron/refresh?mode=liveFeed"

      - name: Verify production benefit readiness
        shell: bash
        run: |
          set -euo pipefail

          base_url="${SITE_URL%/}"
          echo "Verifying production benefit readiness from ${base_url}"

          SITE_URL="${base_url}" node <<'NODE'
          const siteUrl = process.env.SITE_URL;
          const minimumVisibleBenefits = Number(process.env.MINIMUM_VISIBLE_BENEFITS ?? 100);
          if (!Number.isFinite(minimumVisibleBenefits) || minimumVisibleBenefits < 1) {
            throw new Error(`MINIMUM_VISIBLE_BENEFITS must be a positive number, got ${process.env.MINIMUM_VISIBLE_BENEFITS}`);
          }

          async function getJson(path) {
            const url = `${siteUrl}${path}${path.includes("?") ? "&" : "?"}ts=${Date.now()}`;
            const response = await fetch(url, {
              headers: {
                Accept: "application/json",
                "Cache-Control": "no-cache"
              }
            });
            const text = await response.text();
            let body;
            try {
              body = JSON.parse(text);
            } catch {
              throw new Error(`${path} returned non-JSON response: ${text.slice(0, 120)}`);
            }
            if (!response.ok || body?.ok === false) {
              throw new Error(`${path} failed with status ${response.status}: ${JSON.stringify(body).slice(0, 240)}`);
            }
            return body;
          }

          const health = await getJson("/api/health");
          const freebies = await getJson("/api/freebies?limit=12");
          const firstPartyFeed = await getJson("/api/feeds/free-benefits?limit=12");
          const visibleBenefits = Number(health?.checks?.officialBenefitVisibleCount ?? 0);
          const freebieEvents = Number(freebies?.eventCount ?? freebies?.count ?? 0);
          const firstPartyFeedCount = Number(firstPartyFeed?.count ?? 0);
          const freshnessOk = health?.checks?.officialBenefitFresh === true || health?.checks?.officialBenefitRefreshAllOk === true;

          if (visibleBenefits < minimumVisibleBenefits) {
            throw new Error(`officialBenefitVisibleCount is too low: ${visibleBenefits}/${minimumVisibleBenefits}`);
          }
          if (freebieEvents < minimumVisibleBenefits) {
            throw new Error(`freebies eventCount is too low: ${freebieEvents}/${minimumVisibleBenefits}`);
          }
          if (firstPartyFeed?.feedKind !== "halindosa-free-benefits" || firstPartyFeed?.source !== "halindosa_first_party_verified_feed") {
            throw new Error("first-party free benefit feed contract is not available on production.");
          }
          if (firstPartyFeedCount < 12) {
            throw new Error(`first-party free benefit feed returned too few items: ${firstPartyFeedCount}/12`);
          }
          if (firstPartyFeed?.policy?.publishableOnly !== true || firstPartyFeed?.policy?.officialOnly !== true || firstPartyFeed?.policy?.verifiedOnly !== true) {
            throw new Error("first-party free benefit feed is missing strict publishable/official/verified policy flags.");
          }
          for (const item of firstPartyFeed.items ?? []) {
            const missing = ["claimUrl", "canonicalUrl", "dedupeKey", "deadlineStatus", "displayBadges", "linkTrust"].filter((field) => {
              const value = item?.[field];
              if (Array.isArray(value)) return value.length === 0;
              return !String(value ?? "").trim();
            });
            if (missing.length) {
              throw new Error(`first-party free benefit item ${item?.id ?? "(missing id)"} is missing metadata: ${missing.join(", ")}`);
            }
            if (!/^https:\/\//.test(String(item.claimUrl)) || !/^https:\/\//.test(String(item.canonicalUrl))) {
              throw new Error(`first-party free benefit item ${item.id} has unsafe claim/canonical URL.`);
            }
            if (!["today", "week", "soon", "none"].includes(item.deadlineStatus)) {
              throw new Error(`first-party free benefit item ${item.id} has invalid deadlineStatus: ${item.deadlineStatus}`);
            }
            if (item.linkTrust !== "official_verified" || !item.displayBadges.includes("공식")) {
              throw new Error(`first-party free benefit item ${item.id} is missing official verified trust badges.`);
            }
          }
          if (!freshnessOk) {
            throw new Error("official benefit freshness check is not passing.");
          }

          console.log(`Production benefit readiness OK: health=${visibleBenefits}, freebies=${freebieEvents}, firstPartyFeed=${firstPartyFeedCount}`);
          NODE
