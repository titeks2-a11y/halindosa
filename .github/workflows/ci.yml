name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Commercial audit
        run: npm run audit:commercial

      - name: Environment doctor regression
        run: npm run test:env

      - name: Public URL readiness
        run: npm run public:url:doctor

      - name: Lint
        run: npm run lint

      - name: Mobile UX regression
        run: npm run test:mobile-ux

      - name: Refresh official benefit snapshot
        run: npm run refresh:news

      - name: Verify official benefit snapshot
        run: npm run verify:news

      - name: Home realtime regression
        run: npm run home:realtime:doctor

      - name: Security regression
        run: npm run security:check

      - name: Consumer benefit priority regression
        run: npm run benefit:priority:doctor

      - name: Free benefit category coverage
        run: npm run benefit:category:doctor

      - name: Free benefit API contract
        run: npm run benefit:api-contract

      - name: Free benefit event contract
        run: npm run benefit:event:contract

      - name: SEO regression
        run: npm run test:seo

      - name: Performance regression
        run: npm run test:perf

      - name: Prepare release doctor reports
        timeout-minutes: 12
        env:
          DEAL_LINK_TIMEOUT_MS: "2500"
          REFRESH_ALL_LINK_TIMEOUT_MS: "780000"
        run: npm run release:prepare:reports:ci

      - name: Release doctor
        run: |
          npm run release:doctor || {
            echo "::group::release-doctor report"
            if [ -f reports/release-doctor.json ]; then cat reports/release-doctor.json; fi
            echo "::endgroup::"
            exit 1
          }

      - name: Production build
        run: npm run build

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halindosa-verification-reports
          if-no-files-found: ignore
          path: |
            HARNESS_REPORT.md
            AUDIT_REPORT.md
            EXTERNAL_LINK_REPORT.md
            ENV_DOCTOR_REPORT.md
            PUBLIC_URL_REPORT.md
            STORE_METADATA_REPORT.md
            STORE_ASSETS_REPORT.md
            DEVICE_QA_MANIFEST.json
            DEVICE_QA_REPORT.md
            STORE_SUBMISSION_REPORT.md
            STORE_PACKET_REPORT.md
            STORE_CONSOLE_FIELDS.json
            STORE_MANUAL_CHECKLIST.json
            STORE_MANUAL_CHECKLIST.md
            STORE_HANDOFF_REPORT.md
            RELEASE_NOTES.json
            RELEASE_NOTES.md
            SUPPORT_PLAYBOOK.json
            SUPPORT_PLAYBOOK.md
            KNOWN_ISSUES.md
            STORE_SCREENSHOTS_REPORT.md
            STORE_SCREENSHOT_MANIFEST.json
            IMAGE_OPERATIONS_REPORT.md
            IMAGE_QUALITY_REPORT.md
            LINK_VERIFICATION_REPORT.md
            LINK_VERIFICATION_RESULT.json
            reports/health-readiness.json
            reports/free-benefit-category-coverage.json
            reports/official-benefit-alerts.json
            reports/release-doctor.json
            reports/release-prepare-reports.json
            MOBILE_UX_REPORT.md
            PERFORMANCE_REPORT.md
            SEARCH_REPORT.md
            docs/HARNESS_REPORT.md
            docs/HEALTH_READINESS_REPORT.md
            docs/OFFICIAL_BENEFIT_ALERTS_REPORT.md
            docs/AUDIT_REPORT.md
            docs/ENV_DOCTOR_REPORT.md
            docs/PUBLIC_URL_REPORT.md
            docs/STORE_METADATA_REPORT.md
            docs/STORE_ASSETS_REPORT.md
            docs/DEVICE_QA_MANIFEST.md
            docs/DEVICE_QA_REPORT.md
            docs/STORE_SUBMISSION_REPORT.md
            docs/STORE_PACKET_REPORT.md
            docs/STORE_CONSOLE_FIELDS.md
            docs/STORE_MANUAL_CHECKLIST.md
            docs/STORE_HANDOFF_REPORT.md
            docs/RELEASE_NOTES.md
            docs/SUPPORT_PLAYBOOK.md
            docs/KNOWN_ISSUES.md
            docs/STORE_SCREENSHOTS_REPORT.md
            docs/STORE_SCREENSHOT_MANIFEST.md
            docs/PERFORMANCE_REPORT.md
            docs/release-evidence.md
            docs/link-coverage-report.md
            docs/catalog-quality-report.md
