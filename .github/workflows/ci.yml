name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Commercial audit
        run: npm run audit:commercial

      - name: Environment doctor regression
        run: npm run test:env

      - name: Public URL readiness
        run: npm run public:url:doctor

      - name: Store metadata readiness report
        run: npm run store:metadata:doctor

      - name: Store asset readiness report
        run: npm run store:assets:doctor

      - name: Device QA execution manifest
        run: npm run device:qa:manifest

      - name: Device QA readiness report
        run: npm run device:qa:report

      - name: Store submission readiness report
        run: npm run store:submission:report

      - name: Store packet readiness report
        run: npm run store:packet:doctor

      - name: Store console field manifest
        run: npm run store:console:fields

      - name: Store manual submission checklist
        run: npm run store:manual:checklist

      - name: Store manual submission checklist doctor
        run: npm run store:manual:doctor

      - name: Store launch handoff report
        run: npm run store:handoff:report

      - name: Release notes
        run: npm run release:notes

      - name: Support playbook
        run: npm run support:playbook

      - name: Known issues report
        run: npm run known:issues

      - name: Store screenshot capture manifest
        run: npm run store:screenshots:manifest

      - name: Store screenshot readiness report
        run: npm run store:screenshots:doctor

      - name: Operational health readiness report
        run: npm run health:readiness

      - name: Launch harness
        run: npm run harness

      - name: Release doctor
        run: npm run release:doctor

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halindosa-verification-reports
          if-no-files-found: ignore
          path: |
            HARNESS_REPORT.md
            AUDIT_REPORT.md
            EXTERNAL_LINK_REPORT.md
            ENV_DOCTOR_REPORT.md
            PUBLIC_URL_REPORT.md
            STORE_METADATA_REPORT.md
            STORE_ASSETS_REPORT.md
            DEVICE_QA_MANIFEST.json
            DEVICE_QA_REPORT.md
            STORE_SUBMISSION_REPORT.md
            STORE_PACKET_REPORT.md
            STORE_CONSOLE_FIELDS.json
            STORE_MANUAL_CHECKLIST.json
            STORE_MANUAL_CHECKLIST.md
            STORE_HANDOFF_REPORT.md
            RELEASE_NOTES.json
            RELEASE_NOTES.md
            SUPPORT_PLAYBOOK.json
            SUPPORT_PLAYBOOK.md
            KNOWN_ISSUES.md
            STORE_SCREENSHOTS_REPORT.md
            STORE_SCREENSHOT_MANIFEST.json
            IMAGE_OPERATIONS_REPORT.md
            IMAGE_QUALITY_REPORT.md
            LINK_VERIFICATION_REPORT.md
            LINK_VERIFICATION_RESULT.json
            reports/health-readiness.json
            MOBILE_UX_REPORT.md
            PERFORMANCE_REPORT.md
            SEARCH_REPORT.md
            docs/HARNESS_REPORT.md
            docs/HEALTH_READINESS_REPORT.md
            docs/AUDIT_REPORT.md
            docs/ENV_DOCTOR_REPORT.md
            docs/PUBLIC_URL_REPORT.md
            docs/STORE_METADATA_REPORT.md
            docs/STORE_ASSETS_REPORT.md
            docs/DEVICE_QA_MANIFEST.md
            docs/DEVICE_QA_REPORT.md
            docs/STORE_SUBMISSION_REPORT.md
            docs/STORE_PACKET_REPORT.md
            docs/STORE_CONSOLE_FIELDS.md
            docs/STORE_MANUAL_CHECKLIST.md
            docs/STORE_HANDOFF_REPORT.md
            docs/RELEASE_NOTES.md
            docs/SUPPORT_PLAYBOOK.md
            docs/KNOWN_ISSUES.md
            docs/STORE_SCREENSHOTS_REPORT.md
            docs/STORE_SCREENSHOT_MANIFEST.md
            docs/PERFORMANCE_REPORT.md
            docs/release-evidence.md
            docs/link-coverage-report.md
            docs/catalog-quality-report.md
