name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Commercial audit
        run: npm run audit:commercial

      - name: Launch harness
        run: npm run harness

      - name: Release doctor
        run: npm run release:doctor

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halindosa-verification-reports
          if-no-files-found: ignore
          path: |
            HARNESS_REPORT.md
            EXTERNAL_LINK_REPORT.md
            IMAGE_OPERATIONS_REPORT.md
            IMAGE_QUALITY_REPORT.md
            LINK_VERIFICATION_REPORT.md
            LINK_VERIFICATION_RESULT.json
            MOBILE_UX_REPORT.md
            PERFORMANCE_REPORT.md
            SEARCH_REPORT.md
            docs/HARNESS_REPORT.md
            docs/PERFORMANCE_REPORT.md
            docs/release-evidence.md
            docs/link-coverage-report.md
            docs/catalog-quality-report.md
