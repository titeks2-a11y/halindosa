<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>할인도사 연결 확인</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff7f7;
        color: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 380px);
        border-radius: 24px;
        background: #fff;
        padding: 28px 22px;
        box-shadow: 0 20px 45px rgba(255, 43, 43, 0.14);
        text-align: center;
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(135deg, #ff2b2b, #ff6a3d);
        color: #fff;
        font-weight: 900;
        font-size: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        margin-top: 22px;
        border: 0;
        border-radius: 16px;
        background: #ff2b2b;
        color: #fff;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">할</div>
      <h1>할인도사 연결을 확인 중입니다</h1>
      <p>네트워크가 불안정하거나 서비스 점검 중일 수 있습니다. 잠시 후 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 불러오기</button>
    </main>
  </body>
</html>
